## Tálcafűtés, Klicky szonda, Z tilt, bed mesh

[heater_bed]
heater_pin: P2.0
sensor_type: Generic 3950
sensor_pin: P0.23
smooth_time: 3.0
pwm_cycle_time: 0.0166
max_power: 1.0
min_temp: 0
max_temp: 130

[probe]
pin: ^P1.25
x_offset: 0
y_offset: 21.00
#z_offset: 7.205
#z_offset: 7.205
speed: 3
samples:3
samples_result: median
samples_tolerance: 0.03
samples_tolerance_retries: 5
sample_retract_dist: 0.5

[z_tilt]
speed: 150
z_positions:
    202,100
     8,100
points:
   202,100
    8,100
retries: 6
retry_tolerance: 0.03
horizontal_move_z: 10

[bed_mesh]
speed: 300
horizontal_move_z: 8.0
mesh_min: 3,21
mesh_max: 208,210
probe_count: 7,7
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
