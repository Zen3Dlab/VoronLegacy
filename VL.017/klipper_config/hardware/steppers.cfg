## Léptetőmotorok és TMC2209 meghajtók (X, Y, Z, Z1)

[stepper_x]
enable_pin: !P2.1
step_pin: P2.2
dir_pin: P2.6
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 128

endstop_pin: ^P1.28
position_min: -2
position_endstop: 212
position_max: 212
homing_speed: 100.0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: P1.17
run_current: 0.85
interpolate: true      ; autotune-hoz
sense_resistor: 0.110
#stealthchop_threshold: 0   ; az autotune kezeli

[stepper_y]
enable_pin: !P2.8
step_pin: P0.19
dir_pin: P0.20
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 128

endstop_pin: ^P1.26
position_min: 0
position_endstop: 228
position_max: 228
homing_speed: 100.0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: P1.15
run_current: 0.85
interpolate: true      ; autotune-hoz
sense_resistor: 0.110
#stealthchop_threshold: 0   ; az autotune kezeli

[stepper_z]
step_pin: P0.1
dir_pin: P0.0
enable_pin: !P0.10

rotation_distance: 8 
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 240
position_min: -10
homing_speed: 10.0

[tmc2209 stepper_z]
uart_pin: P1.1
interpolate: true
run_current: 0.7
sense_resistor: 0.110
#stealthchop_threshold: 0   ; az autotune kezeli


[stepper_z1]
enable_pin: !P0.21
step_pin: P0.22
dir_pin: P2.11
rotation_distance: 8 
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: P1.10
interpolate: true
run_current: 0.7
sense_resistor: 0.110
#stealthchop_threshold: 0   ; az autotune kezeli
