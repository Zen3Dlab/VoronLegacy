## Saját makrók – a régi mainsail.cfg-ből átemelve és korszerűsítve (2026-10)

## A Mainsail beépített PAUSE / RESUME / CANCEL_PRINT makróinak beállítása
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True   ; régi viselkedés: parkolás jobb elöl
variable_custom_park_x    : 207.0
variable_custom_park_y    : 5.0
variable_custom_park_dz   : 20.0   ; ennyit emel Z-n szünetnél
variable_retract          : 2.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 2.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : False
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 0
variable_runout_sensor    : ""
variable_user_pause_macro : "SFS_DISABLE"
variable_user_resume_macro: "SFS_ENABLE"
variable_user_cancel_macro: "SFS_DISABLE"
gcode:

[gcode_macro M600]
description: Filamentcsere
gcode:
    PAUSE
    UNLOAD_FILAMENT

[gcode_macro PRINT_START]
description: Nyomtatás indítása (a szeletelő hívja)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    ## Purge vonal Y helye: közvetlenül a nyomtatott terület elé
    {% set purge_y = 2.0 %}
    {% if params.AREA_START is defined and params.AREA_START.split(",")|length == 2 %}
        {% set purge_y = [params.AREA_START.split(",")[1]|float - 2.0, 2.0]|max %}
    {% endif %}

    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}

    M117 Homing...
    G28                      ; a Klicky homing a Z tiltet is elvégzi
    M117

    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    ## Beépített adaptív szintezés: csak a nyomtatott tárgyak alatt mér
    ## (a szeletelőben az "Exclude objects / Label objects" legyen bekapcsolva)
    BED_MESH_CALIBRATE ADAPTIVE=1

    ## Purge vonal
    G92 E0
    G90
    G0 X70 Y{purge_y} F6000
    G0 Z0.4
    G91
    G1 X90 E20 F1200
    G1 Y1
    G1 X-45 E2 F1200
    G92 E0
    G1 E-0.2 F3600
    G90
    G1 Z3.0 F600
    G92 E0

    SFS_ENABLE

[gcode_macro PRINT_END]
description: Nyomtatás vége
gcode:
    M400
    G92 E0
    G1 E-4.0 F3600
    G91

    SFS_DISABLE

    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}
    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}
    {% if printer.toolhead.position.z < (max_z - 30) %}
        {% set z_safe = 30.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 Z{z_safe} F3600
    G0 X{x_safe} Y{y_safe} F20000
    TURN_OFF_HEATERS
    M107

    {% set park_x = range(20, 210)|random %}
    G90
    G0 X{park_x} Y210 F3600
