## Adaptív purge vonal
## A nyomtatott terület (első réteg) mellé, attól "margin" távolságra húz egy
## vastag tisztító vonalat. Sorrend: elöl -> bal -> jobb -> hátul; ahol elfér.
## Ha sehol nem fér el, a legnagyobb szabad sáv közepére kerül.
## Hívás: PURGE_LINE AREA_START=x,y AREA_END=x,y  (a PRINT_START adja át)

[gcode_macro PURGE_LINE]
description: Adaptív purge vonal a nyomtatott terület mellett
variable_margin: 10      ; távolság a nyomtatott területtől (mm)
variable_edge: 4         ; minimális távolság a tálca szélétől (mm)
variable_length: 60      ; vonal hossza (mm)
variable_amount: 20      ; vonalba nyomott filament (mm) – max. ~24 mm 60 mm-es vonalnál (0,5 mm-es fúvóka: max_extrude_cross_section = 1,0 mm²)
variable_prime: 3        ; előtöltés a vonal elején, álló helyzetben (mm)
variable_flow: 10        ; térfogatáram (mm3/s)
variable_height: 0.8     ; vonal magassága (mm)
variable_wipe: 10        ; visszatörlés a vonalon, extrudálás nélkül (mm)
gcode:
    {% set th = printer.toolhead %}
    {% set bx0 = [th.axis_minimum.x, 0]|max + edge %}
    {% set by0 = [th.axis_minimum.y, 0]|max + edge %}
    {% set bx1 = th.axis_maximum.x - edge %}
    {% set by1 = th.axis_maximum.y - edge %}
    {% set len_x = [length, bx1 - bx0]|min %}
    {% set len_y = [length, by1 - by0]|min %}
    {% set p = namespace(found=False, x0=bx0, y0=by0, x1=bx0 + len_x, y1=by0, side='tálca eleje') %}

    {% if params.AREA_START is defined and params.AREA_END is defined %}
        {% set ax0 = params.AREA_START.split(",")[0]|float %}
        {% set ay0 = params.AREA_START.split(",")[1]|float %}
        {% set ax1 = params.AREA_END.split(",")[0]|float %}
        {% set ay1 = params.AREA_END.split(",")[1]|float %}
        {% set cx = (ax0 + ax1) / 2 %}
        {% set cy = (ay0 + ay1) / 2 %}
        {% set sx = [[cx - len_x / 2, bx0]|max, bx1 - len_x]|min %}
        {% set sy = [[cy - len_y / 2, by0]|max, by1 - len_y]|min %}
        {% if ay0 - margin >= by0 %}
            {% set p.found = True %}
            {% set p.side = 'elöl' %}
            {% set p.x0 = sx %}
            {% set p.y0 = ay0 - margin %}
            {% set p.x1 = sx + len_x %}
            {% set p.y1 = ay0 - margin %}
        {% elif ax0 - margin >= bx0 %}
            {% set p.found = True %}
            {% set p.side = 'bal oldalt' %}
            {% set p.x0 = ax0 - margin %}
            {% set p.y0 = sy %}
            {% set p.x1 = ax0 - margin %}
            {% set p.y1 = sy + len_y %}
        {% elif ax1 + margin <= bx1 %}
            {% set p.found = True %}
            {% set p.side = 'jobb oldalt' %}
            {% set p.x0 = ax1 + margin %}
            {% set p.y0 = sy %}
            {% set p.x1 = ax1 + margin %}
            {% set p.y1 = sy + len_y %}
        {% elif ay1 + margin <= by1 %}
            {% set p.found = True %}
            {% set p.side = 'hátul' %}
            {% set p.x0 = sx %}
            {% set p.y0 = ay1 + margin %}
            {% set p.x1 = sx + len_x %}
            {% set p.y1 = ay1 + margin %}
        {% else %}
            ## sehol nincs "margin" hely: a legnagyobb szabad sáv közepére kerül
            {% set gf = ay0 - by0 %}
            {% set gl = ax0 - bx0 %}
            {% set gr = bx1 - ax1 %}
            {% set gb = by1 - ay1 %}
            {% set gmax = [gf, gl, gr, gb]|max %}
            {% if gmax == gf %}
                {% set p.side = 'elöl (szűk hely)' %}
                {% set p.x0 = sx %}
                {% set p.y0 = by0 + [gf, 0]|max / 2 %}
                {% set p.x1 = sx + len_x %}
                {% set p.y1 = by0 + [gf, 0]|max / 2 %}
            {% elif gmax == gl %}
                {% set p.side = 'bal oldalt (szűk hely)' %}
                {% set p.x0 = bx0 + gl / 2 %}
                {% set p.y0 = sy %}
                {% set p.x1 = bx0 + gl / 2 %}
                {% set p.y1 = sy + len_y %}
            {% elif gmax == gr %}
                {% set p.side = 'jobb oldalt (szűk hely)' %}
                {% set p.x0 = bx1 - gr / 2 %}
                {% set p.y0 = sy %}
                {% set p.x1 = bx1 - gr / 2 %}
                {% set p.y1 = sy + len_y %}
            {% else %}
                {% set p.side = 'hátul (szűk hely)' %}
                {% set p.x0 = sx %}
                {% set p.y0 = by1 - gb / 2 %}
                {% set p.x1 = sx + len_x %}
                {% set p.y1 = by1 - gb / 2 %}
            {% endif %}
        {% endif %}
    {% endif %}

    ## sebességek a térfogatáramból (1,75 mm filament)
    {% set area = 3.14159 * 0.875 * 0.875 %}
    {% set e_speed = flow / area %}
    {% set line_len = ((p.x1 - p.x0) ** 2 + (p.y1 - p.y0) ** 2) ** 0.5 %}
    {% set move_speed = line_len / (amount / e_speed) %}
    {% set wx = p.x1 - (p.x1 - p.x0) / line_len * wipe %}
    {% set wy = p.y1 - (p.y1 - p.y0) / line_len * wipe %}

    RESPOND MSG="Purge vonal: {p.side} ({'%.0f' % p.x0},{'%.0f' % p.y0}) -> ({'%.0f' % p.x1},{'%.0f' % p.y1})"
    SAVE_GCODE_STATE NAME=PURGE_LINE_STATE
    G90
    M83
    {% if th.position.z < 5 %}
        G1 Z5 F600
    {% endif %}
    G1 X{p.x0} Y{p.y0} F12000
    G1 Z{height} F600
    G1 E{prime} F{e_speed * 60}
    G1 X{p.x1} Y{p.y1} E{amount} F{move_speed * 60}
    G1 E-0.2 F2100
    G1 X{wx} Y{wy} F6000
    G1 Z{height + 2} F600
    G92 E0
    RESTORE_GCODE_STATE NAME=PURGE_LINE_STATE
