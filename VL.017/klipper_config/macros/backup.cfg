## Konfig mentése GitHubra egy gombnyomással (G-Code Shell Command)
## A ~/voron-backup.sh szkriptet futtatja (ugyanaz, mint az éjszakai cron)

[gcode_shell_command backup_config]
command: /home/pi/voron-backup.sh
timeout: 90.
verbose: True

[gcode_macro BACKUP_CONFIG]
description: Konfig mentése a GitHubra (Zen3Dlab/VoronLegacy)
gcode:
    RUN_SHELL_COMMAND CMD=backup_config
