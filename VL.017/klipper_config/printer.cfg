## Voron Legacy VL.017 – fő konfig
## A részletek a hardware/ és macros/ mappákban vannak.
## A SAVE_CONFIG blokk (PID, input shaper, z_offset, bed mesh) itt marad alul.

[include mainsail.cfg]
[include hardware/steppers.cfg]
[include hardware/extruder.cfg]
[include hardware/bed.cfg]
[include hardware/fans.cfg]
[include hardware/display.cfg]
[include hardware/sensors.cfg]
[include hardware/autotune.cfg]
[include macros/klicky-probe-for-Legacy.cfg]
[include macros/macros.cfg]
[include macros/purge.cfg]
[include macros/utility.cfg]
[include macros/test_speed.cfg]
[include macros/backup.cfg]

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 4000
max_z_velocity: 10
max_z_accel: 200
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[mcu rpi]
serial: /home/pi/printer_data/comms/klipper_host_mcu

[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

