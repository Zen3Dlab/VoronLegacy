[include mainsail.cfg] 

[include klicky-probe-for-Legacy.cfg] 

[include macros.cfg] 

[include test_speed.cfg] 

[exclude_object]

[filament_switch_sensor toolhead_sensor]
pause_on_runout: False
switch_pin: ^P1.27

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 4000
max_z_velocity: 10
max_z_accel: 200
square_corner_velocity: 5.0


[idle_timeout]
timeout: 1800

[stepper_x]
enable_pin: !P2.1
step_pin: P2.2
dir_pin: P2.6
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 128

endstop_pin: ^P1.28
position_min: -2
position_endstop: 212
position_max: 212
homing_speed: 100.0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: P1.17
run_current: 0.85
interpolate: false
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
enable_pin: !P2.8
step_pin: P0.19
dir_pin: P0.20
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 128

endstop_pin: ^P1.26
position_min: 0
position_endstop: 228
position_max: 228
homing_speed: 100.0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: P1.15
run_current: 0.85
interpolate: false
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
enable_pin: !P0.21
step_pin: P0.22
dir_pin: P2.11
rotation_distance: 8 
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: P1.10
interpolate: true
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: P0.1
dir_pin: P0.0
enable_pin: !P0.10

rotation_distance: 8 
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 240
position_min: -10
homing_speed: 10.0

[tmc2209 stepper_z]
uart_pin: P1.1
interpolate: true
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

#[homing_override]
#set_position_z: 0
#set_position_x: 0
#set_position_y: 0
#axes: xyz
#gcode:
#    G90
#    G0 Z5 F600
#    G28 X0 Y0
#    G0 X117.5 Y95 F5000
#    G28 Z0
#    G0 Z5 F500

[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
#rotation_distance: 21.6
#rotation_distance: 4.637

rotation_distance: 4.59


#gear_ratio: 50:17
microsteps: 16
full_steps_per_rotation: 200

nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: P2.5
sensor_type: ATC Semitec 104GT-2
sensor_pin: P0.24

min_temp: 0
max_temp: 260
max_extrude_only_distance: 500
max_extrude_only_velocity: 120

pressure_advance: 0.03
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: P1.8
run_current: 0.8
sense_resistor: 0.110
interpolate: false

[verify_heater extruder]
max_error: 120
hysteresis: 5
check_gain_time: 30

[heater_bed]
heater_pin: P2.0
sensor_type: Generic 3950
sensor_pin: P0.23
smooth_time: 3.0
pwm_cycle_time: 0.0166
max_power: 1.0
min_temp: 0
max_temp: 130

[fan]
pin: P2.7

[controller_fan my_controller_fan]
pin: P2.3
max_power: 0.3
kick_start_time: 0.200
heater: heater_bed

# thermally controlled hotend fan
[heater_fan my_nozzle_fan]
pin: P2.4
max_power: 1.0
kick_start_time: 0.100
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[bed_mesh]
speed: 300
horizontal_move_z: 8.0
mesh_min: 3,21
mesh_max: 208,210
probe_count: 7,7
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[probe]
pin: ^P1.25
x_offset: 0
y_offset: 21.00
#z_offset: 7.205
#z_offset: 7.205
speed: 3
samples:3
samples_result: median
samples_tolerance: 0.03
samples_tolerance_retries: 5
sample_retract_dist: 0.5

[z_tilt]
speed: 150
z_positions:
    202,100
     8,100
points:
   202,100
    8,100
retries: 6
retry_tolerance: 0.03
horizontal_move_z: 10

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[mcu rpi]
serial: /home/pi/printer_data/comms/klipper_host_mcu

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    115, 115, 40  # an example

[display]
#    mini12864 LCD Display
lcd_type: uc1701
cs_pin: P1.18
a0_pin: P1.19
rst_pin: P1.20
encoder_pins: ^P3.26,^P3.25
click_pin: ^!P0.28
contrast: 63
spi_software_sclk_pin: P0.15
spi_software_mosi_pin: P0.18
spi_software_miso_pin: P0.17

[neopixel fysetc_mini12864]
##    To control Neopixel RGB in mini12864 display
pin: P1.21
chain_count: 3
initial_RED: 0.8
initial_GREEN: 0.6
initial_BLUE: 0.15
color_order: RGB

[gcode_macro DISABLE_MOTORS]
gcode:
    M18

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[filament_motion_sensor SFS_T0]
detection_length: 8.00 ; This can be adjusted to your desired level of sensitivity. 10 is a recommended value to prevent flow dropoff false triggers.
extruder: extruder
switch_pin: ^P1.24
pause_on_runout: True ; This can be set to false to debug false positives putting the sensor in "monitor mode". The printer will not pause but it will run the runout_gcode below.
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    M117 Runout Detected!

[delayed_gcode DISABLEFILAMENTSENSOR] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=SFS_T0 ENABLE=0 ; Put your filament sensor's name after SENSOR=

[gcode_macro SFS_ENABLE] ; Add this to PRINT_START
description: Enable smart filament sensor
gcode:
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=SFS_T0 ENABLE=1 ; Put your filament sensor's name after SENSOR=

[gcode_macro SFS_DISABLE] ; Add this to PRINT_END and PRINT_CANCEL
description: Disable smart filament sensor
gcode:
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=SFS_T0 ENABLE=0 ; Put your filament sensor's name after SENSOR=



[menu __main __octoprint]
type: disabled

[gcode_macro LOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E40 F300                    ; load
   G1 E30 F150                    ; prime nozzle with filament
   M82                            ; set extruder to absolute
    
[gcode_macro UNLOAD_FILAMENT]
gcode:
   M83                            ; set extruder to relative
   G1 E1 F50                      ; extrude a little to soften tip
   G1 E-1 F3600           
   G1 E-60 F1800                  ; retract some, but not too much or it will jam
   M82                            ; set extruder to absolute      ; set extruder to absolute

